name: Deploy FE

on:
  push:
    paths:
      - 'web/fe/**'
      - 'web/pnpm-workspace.yaml'
      - 'web/pnpm-lock.yaml'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install & Build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter fe build

      - name: Verify secrets
        run: |
          : "${{ secrets.TX_HOST:?TX_HOST is not set }}"
          : "${{ secrets.TX_ROOT:?TX_ROOT is not set }}"
          : "${{ secrets.TX_KEY:?TX_KEY is not set }}"
          : "${{ secrets.CPDD_FE_PATH:?CPDD_FE_PATH is not set }}"
          echo "TX_HOST=${{ secrets.TX_HOST }}"
          echo "CPDD_FE_PATH=${{ secrets.CPDD_FE_PATH }}"

      - name: Upload to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TX_HOST }}
          username: ${{ secrets.TX_ROOT }}
          key: ${{ secrets.TX_KEY }}
          source: "web/fe/dist/"
          target: ${{ secrets.CPDD_FE_PATH }}
          overwrite: true
