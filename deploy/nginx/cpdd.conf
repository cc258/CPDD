# CPDD 前端静态资源反代 + 后端 API 反代
# 文件放到 /etc/nginx/conf.d/cpdd.conf
# nginx -t && nginx -s reload

# —— 用户端 fe ——
server {
    listen 80;
    server_name _;

    # fe 静态站点根目录（替换成服务器上实际路径）
    root /root/www/cpdd/fe;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代（含 WebSocket 聊天）
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 文件上传大小（100m）
    client_max_body_size 100m;
}

# —— 管理后台 admin（同端口，另一个端口或用子路径都行）——
# 如果用子路径 /admin/，把上面 / 改成 /admin/ 并把 root 指向 admin dist 即可
# 这里用端口 5174 独立服务，跟旧的 pv 服务互不干扰
server {
    listen 5174;
    server_name _;

    root /root/www/cpdd/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    client_max_body_size 100m;
}
