[project]
name = "cpdd-api"
version = "0.1.0"
description = "CPDD backend RESTful API (FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1",
    "email-validator>=2.2",
    "qrcode>=8.0",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
]

[tool.uv]
package = false
